<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes do Produto</title>
    <link rel="stylesheet" href="produto-detalhes.css">
</head>
<body>

    <canvas id="canvas"></canvas>

    <button id="modoEscuro">🌙</button>

    <div class="container">

        <a href="index.html" class="voltar">← Voltar</a>

        <div class="card">

            <h1 id="nome">Carregando...</h1>

            <div class="informacoes">

                <div class="informacao">
                    <strong>Nome</strong>
                    <span id="nomeProduto">Carregando...</span>
                </div>

                <div class="informacao">
                    <strong>Categoria</strong>
                    <span id="categoria">Carregando...</span>
                </div>

                <div class="informacao">
                    <strong>Preço</strong>
                    <span id="preco">Carregando...</span>
                </div>

                <div class="informacao">
                    <strong>Estoque</strong>
                    <span id="estoque">Carregando...</span>
                </div>

                <div class="informacao">
                    <strong>Data de criação</strong>
                    <span id="dataCriacao">Carregando...</span>
                </div>

                <div class="informacao">

                    <strong>ID do produto</strong>

                    <div class="id-container">
                        <span id="idProduto">Carregando...</span>
                    </div>

                    <small id="mensagemCopiado"></small>

                </div>

            </div>

        </div>

        <div class="avaliacao">

            <h2>Avalie este produto</h2>

            <p>Como você avalia este produto?</p>

            <div class="estrelas">

                <button class="estrela" data-valor="1">★</button>
                <button class="estrela" data-valor="2">★</button>
                <button class="estrela" data-valor="3">★</button>
                <button class="estrela" data-valor="4">★</button>
                <button class="estrela" data-valor="5">★</button>

            </div>

            <p id="mensagemAvaliacao">
                Clique em uma estrela para avaliar
            </p>

        </div>

    </div>

    <script src="produto-detalhes.js"></script>

</body>
</html>
